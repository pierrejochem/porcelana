<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="author" content="Pierre Jochem" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#2b4fc0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1638" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{BASE}}apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="{{BASE}}sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Porcelana" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:image" content="https://pierrejochem.github.io/porcelana/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Porcelana UI: raised switches, sliders and cards in porcelain white and cobalt blue" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="https://pierrejochem.github.io/porcelana/og-image.png" />

    <script type="application/ld+json">{{JSONLD}}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{BASE}}app.css" />
  </head>
  <body data-page="{{PAGE}}" data-base="{{BASE}}">
    <div id="root">{{BODY}}</div>
    <script type="module" src="{{BASE}}app.js"></script>
  </body>
</html>
